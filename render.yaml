# Render Blueprint Specification
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: livestock-management-api
    env: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node server/src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
      - key: BLOCKCHAIN_RPC_URL
        sync: false
      - key: BLOCKCHAIN_PRIVATE_KEY
        sync: false
      - key: BLOCKCHAIN_CONTRACT_ADDRESS
        sync: false
      - key: BLOCKCHAIN_ALLOWED_CHAIN_ID
        value: "11155111"
