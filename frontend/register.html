<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — Livestock App Lesotho</title>
  <link rel="stylesheet" href="styles.css"/>
  <script src="config.js"></script>
  <script src="core.js"></script>
</head>
<body class="auth-page">
  <div id="toast-container"></div>

  <div class="auth-card">
    <div class="auth-brand">
      <div style="font-size:36px; margin-bottom:4px;">🌾</div>
      <h1>Agri<span>Chain</span> Lesotho</h1>
      <p style="font-size:12px; color:var(--text-muted); margin-top:2px;">Livestock Management &amp; Blockchain Provenance</p>
    </div>

    <div id="alert-box" style="display:none;" class="alert"></div>

    <form id="reg-form">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" id="name" class="form-input" placeholder="e.g. Thato Sekhantso or Thabo Mofokeng" required/>
      </div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" id="email" class="form-input" placeholder="e.g. charlesthato04@gmail.com or farmer@farms.ls" required/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-input" placeholder="Minimum 8 characters" required minlength="8"/>
      </div>
      <div class="form-group">
        <label class="form-label">Select Role</label>
        <select id="role" class="form-select">
          <option value="farmer">🌾 Farmer (Herd Owner)</option>
          <option value="veterinary_officer">💉 Veterinary Officer</option>
          <option value="buyer">🛒 Livestock Buyer (Butchery / Meat Trader)</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; margin-top:4px;" id="btn-reg">
        Create Account
      </button>
    </form>

    <p style="text-align:center; margin-top:20px; font-size:13.5px; color:var(--text-muted);">
      Already have an account? <a href="login.html">Login here</a>
    </p>

    <p style="text-align:center; margin-top:10px; font-size:12px; color:var(--text-muted);">
      <a href="marketplace.html">Browse Public Livestock Marketplace (No Login Needed)</a>
    </p>
  </div>

  <script>
    const redirectParam = new URLSearchParams(location.search).get('redirect');
    if (AG.currentUser()) {
      const u = AG.currentUser();
      if (redirectParam) {
        location.href = redirectParam;
      } else {
        location.href = u.role === 'veterinary_officer' ? 'vet-dashboard.html' : u.role === 'buyer' ? 'marketplace.html' : (u.registered ? 'dashboard.html' : 'welcome.html');
      }
    }

    const urlRole = new URLSearchParams(location.search).get('role');
    if (urlRole && document.getElementById('role')) {
      document.getElementById('role').value = urlRole;
    }

    document.getElementById('reg-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-reg');
      const alertBox = document.getElementById('alert-box');

      btn.disabled = true;
      btn.textContent = 'Creating account…';
      alertBox.style.display = 'none';

      const name     = document.getElementById('name').value.trim();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const role     = document.getElementById('role').value;

      const API = window.AGRI_CONFIG.API_URL;
      try {
        const res = await fetch(`${API}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, role })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Registration failed');

        const loginRes = await AG.login(email, password);
        if (loginRes.ok) {
          const u = loginRes.user;
          if (redirectParam) {
            location.href = redirectParam;
            return;
          }
          location.href = u.role === 'veterinary_officer' ? 'vet-dashboard.html'
                        : u.role === 'buyer' ? 'marketplace.html' : (u.registered ? 'dashboard.html' : 'welcome.html');
        } else {
          location.href = 'login.html';
        }
      } catch (err) {
        alertBox.className = 'alert alert-danger';
        alertBox.textContent = err.message;
        alertBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
